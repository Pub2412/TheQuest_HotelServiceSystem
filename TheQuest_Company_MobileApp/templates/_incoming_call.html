<!-- Incoming Call Heads-Up Notification (Matching DesktopApp Voice Dispatch) -->
<div id="incoming-call" class="incoming-call">
  <div class="incoming-call-info">
    <div class="incoming-call-avatar">📞</div>
    <div class="incoming-call-text">
      <strong id="incoming-from">Incoming Staff Dispatch</strong>
      <span>The Quest • Internal Softphone Intercom</span>
    </div>
  </div>
  <div class="incoming-call-actions">
    <button id="answer-call" class="call-action-btn accept" type="button" title="Accept Call">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
    </button>
    <button id="reject-call" class="call-action-btn decline" type="button" title="Decline Call">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>

<!-- Active Softphone Dialog (Matching DesktopApp PhoneCallModal) -->
<div id="active-call" class="active-call">
  <div class="active-call-brand">THE QUEST • VOICE DISPATCH</div>

  <div>
    <div class="active-call-avatar">☎</div>
    <h2 id="active-call-name">Staff Member</h2>
    <p id="active-call-role"></p>
    <strong id="active-call-status">Connected</strong>
    <div id="active-call-timer">00:00</div>
  </div>

  <div class="active-call-controls">
    <button id="mute-call" class="mute-btn" type="button">
      <span>🎤 Mute Audio</span>
    </button>
    <button id="end-call" class="end-btn" type="button">
      <span>✕ Terminate</span>
    </button>
  </div>
</div>

<script>
  (function () {
    var activeCall = null;
    var microphone = null;
    var audioContext = null;
    var callStartedAt = null;
    var timerHandle = null;
    var ringtoneHandle = null;
    var isMuted = false;

    var panel = document.getElementById("incoming-call");
    var from = document.getElementById("incoming-from");
    var callScreen = document.getElementById("active-call");
    var callName = document.getElementById("active-call-name");
    var callRole = document.getElementById("active-call-role");
    var callStatus = document.getElementById("active-call-status");
    var callTimer = document.getElementById("active-call-timer");
    var muteBtn = document.getElementById("mute-call");
    var answerBtn = document.getElementById("answer-call");
    var rejectBtn = document.getElementById("reject-call");
    var endCallBtn = document.getElementById("end-call");

    function hideIncomingCall() {
      if (panel) {
        panel.classList.remove("show-call");
        panel.style.display = "none";
      }
      stopRingtone();
    }

    function showIncomingCall(callerName, callerRole) {
      if (!panel || !from) return;
      var cleanRole = (callerRole || "").replace(/_/g, " ");
      from.textContent = callerName + " (" + cleanRole + ")";
      panel.classList.add("show-call");
      panel.style.display = "flex";
      startRingtone();
      if (navigator.vibrate) {
        try { navigator.vibrate([300, 150, 300]); } catch (e) {}
      }
    }

    function hideCallScreen() {
      if (callScreen) {
        callScreen.classList.remove("show-call");
        callScreen.style.display = "none";
      }
      stopRingtone();
      callStartedAt = null;
      if (timerHandle) {
        clearInterval(timerHandle);
        timerHandle = null;
      }
      if (microphone) {
        try {
          microphone.getTracks().forEach(function (track) { track.stop(); });
        } catch (e) {}
        microphone = null;
      }
    }

    function showCallScreen(call) {
      hideIncomingCall();
      if (!callScreen) return;
      if (callName) callName.textContent = call.name || "Staff Member";
      if (callRole) callRole.textContent = (call.role || "").replace(/_/g, " ");
      if (callStatus) callStatus.textContent = (call.status === "answered") ? "Connected" : "Calling...";
      callScreen.classList.add("show-call");
      callScreen.style.display = "flex";
      if (!callStartedAt) callStartedAt = Date.now();
      if (!timerHandle) {
        timerHandle = setInterval(function () {
          var elapsed = Math.floor((Date.now() - callStartedAt) / 1000);
          var minutes = String(Math.floor(elapsed / 60)).padStart(2, "0");
          var seconds = String(elapsed % 60).padStart(2, "0");
          if (callTimer) callTimer.textContent = minutes + ":" + seconds;
        }, 1000);
      }
    }

    // Default: completely hidden
    hideIncomingCall();
    hideCallScreen();

    function tryMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.resolve(false);
      }
      return navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function (stream) {
          microphone = stream;
          return true;
        })
        .catch(function (error) {
          console.warn("Microphone access unavailable; continuing in simulated audio mode.", error);
          return false;
        });
    }

    function playCallTone() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioContext = new AudioCtx();
        var oscillator = audioContext.createOscillator();
        var gain = audioContext.createGain();
        oscillator.frequency.value = 440;
        gain.gain.value = 0.04;
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.25);
      } catch (error) {
        // Ignored if autoplay is blocked
      }
    }

    function startRingtone() {
      if (ringtoneHandle) return;
      playCallTone();
      ringtoneHandle = setInterval(playCallTone, 1200);
    }

    function stopRingtone() {
      if (ringtoneHandle) clearInterval(ringtoneHandle);
      ringtoneHandle = null;
    }

    function updateCall(id, status) {
      var body = new URLSearchParams({ status: status });
      return fetch("/calls/" + id, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      }).then(function (response) {
        if (!response.ok) throw new Error("Call state could not be updated.");
      });
    }

    function poll() {
      fetch("{{ url_for('calls') }}", {
        cache: "no-store",
        credentials: "same-origin"
      })
      .then(function (response) {
        if (!response.ok) return null;
        return response.json();
      })
      .then(function (data) {
        if (!data || !data.call) {
          hideIncomingCall();
          hideCallScreen();
          activeCall = null;
          return;
        }

        activeCall = data.call;
        if (data.call.status === "ringing" && data.call.direction === "incoming") {
          showIncomingCall(data.call.name, data.call.role);
        } else if (data.call.status === "answered") {
          hideIncomingCall();
          showCallScreen(data.call);
        } else {
          hideIncomingCall();
        }
      })
      .catch(function (error) {
        // Silent poll error recovery
      });
    }

    if (answerBtn) {
      answerBtn.addEventListener("click", function () {
        if (!activeCall) return;
        updateCall(activeCall.id, "answered").then(function () {
          hideIncomingCall();
          playCallTone();
          activeCall.status = "answered";
          showCallScreen(activeCall);
          tryMicrophone();
        }).catch(function (error) {
          alert("Could not answer call: " + error.message);
        });
      });
    }

    if (rejectBtn) {
      rejectBtn.addEventListener("click", function () {
        if (!activeCall) return;
        updateCall(activeCall.id, "ended").then(function () {
          hideIncomingCall();
          activeCall = null;
        }).catch(function (error) {
          hideIncomingCall();
        });
      });
    }

    if (muteBtn) {
      muteBtn.addEventListener("click", function () {
        isMuted = !isMuted;
        muteBtn.classList.toggle("active", isMuted);
        var label = muteBtn.querySelector("span");
        if (label) label.textContent = isMuted ? "🔇 Audio Muted" : "🎤 Mute Audio";
        if (microphone) {
          microphone.getTracks().forEach(function (track) { track.enabled = !isMuted; });
        }
      });
    }

    if (endCallBtn) {
      endCallBtn.addEventListener("click", function () {
        if (!activeCall) return;
        updateCall(activeCall.id, "ended").then(function () {
          hideCallScreen();
          hideIncomingCall();
          activeCall = null;
        }).catch(function (error) {
          hideCallScreen();
          hideIncomingCall();
          activeCall = null;
        });
      });
    }

    var callForm = document.getElementById("call-form");
    if (callForm) {
      callForm.addEventListener("submit", function (event) {
        event.preventDefault();
        // Starting the call must not wait for an optional microphone permission prompt.
        callForm.submit();
      });
    }

    // Start polling immediately and every 1000ms
    poll();
    setInterval(poll, 1000);

    window.addEventListener("beforeunload", function () {
      if (microphone) {
        try {
          microphone.getTracks().forEach(function (track) { track.stop(); });
        } catch (e) {}
      }
    });
  })();
</script>
