<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Quest - Hotel Management System - Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <!-- Top Branding Banner (Matching DesktopApp LoginPage.py) -->
    <div class="login-header-banner">
      <img class="login-logo" src="{{ url_for('assets', filename='imgs/logo/logo.png') }}" alt="The Quest Logo">
      <h1>The Quest</h1>
      <div class="login-header-subtitle">Hotel Management System</div>
      <div class="login-slogan-divider"></div>
      <div class="login-slogan-text">"We shall never deny a guest, even the most ridiculous request"</div>
    </div>

    <div class="login-body">
      {% if error %}
      <div class="alert" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" id="login-form">
        <div class="form-group">
          <label for="username">Username / Staff ID</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input id="username" name="username" autocomplete="username" placeholder="Enter staff username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter account password" required>
            <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="signin-btn">
          <span>Sign In to Terminal</span>
        </button>
      </form>

      <!-- Quick Role Selection -->
      <div class="login-quick-roles">
        <div class="login-quick-roles-title">Authorized Staff Presets</div>
        <div class="role-pill-group">
          <button type="button" class="role-pill-btn" onclick="fillRole('admin', 'admin123')">Admin</button>
          <button type="button" class="role-pill-btn" onclick="fillRole('cashier', 'cashier123')">Cashier</button>
          <button type="button" class="role-pill-btn" onclick="fillRole('kitchen', 'kitchen123')">Kitchen</button>
          <button type="button" class="role-pill-btn" onclick="fillRole('logistics', 'logistics123')">Logistics</button>
          <button type="button" class="role-pill-btn" onclick="fillRole('utilities', 'utilities123')">Utilities</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const passInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    toggleBtn?.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    function fillRole(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
