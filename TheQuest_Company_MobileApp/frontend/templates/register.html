{% extends "base.html" %}

{% block title %}Staff Registration • {{ system_name }}{% endblock %}

{% block portal_title %}📝 Staff Enrollment Portal{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 0 auto;">

  <div class="app-card">
    <div style="margin-bottom: 14px;">
      <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">Employee Registration</h3>
      <p style="font-size: 0.78rem; color: var(--text-muted);">Create internal credentials with operational clearance.</p>
    </div>

    <form method="POST" action="{{ url_for('register_view') }}">
      <div class="form-group">
        <label for="reg-username">Username *</label>
        <input type="text" id="reg-username" name="username" class="form-control" placeholder="e.g. chef_john" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password *</label>
        <input type="password" id="reg-password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
      </div>

      <div class="form-group">
        <label for="reg-role">Department / Operational Role *</label>
        <select id="reg-role" name="role" class="form-control" required>
          <option value="" disabled selected>-- Select Clearance Level --</option>
          <option value="Admin">👑 Administrator (Full Console Clearance)</option>
          <option value="Cashier">🛎️ Front Desk Cashier (Bookings & Check-In)</option>
          <option value="Staff_Kitchen">🍳 Kitchen Staff (Food Orders & Inventory)</option>
          <option value="Staff_Logistics">🚚 Logistics Staff (Shipments & Freight)</option>
          <option value="Staff_Utilities">🧹 Utilities Staff (Housekeeping & Sanitization)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reg-name">Full Name *</label>
        <input type="text" id="reg-name" name="name" class="form-control" placeholder="e.g. Jonathan Edwards" required>
      </div>

      <div class="form-group">
        <label for="reg-phone">Mobile Number</label>
        <input type="tel" id="reg-phone" name="phone" class="form-control" placeholder="+63 918 000 0000">
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" name="email" class="form-control" placeholder="employee@thequest.com">
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
        <span>📝</span> Create Staff Account
      </button>
    </form>

    <div style="margin-top: 14px; text-align: center;">
      <a href="{{ url_for('login_view') }}" style="font-size: 0.8rem; color: var(--primary); font-weight: 600; text-decoration: none;">
        ← Return to Sign In
      </a>
    </div>
  </div>

</div>
{% endblock %}
